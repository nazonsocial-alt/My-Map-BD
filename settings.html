<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/svg/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="assets/css/app.css"><script>try{var t=JSON.parse(localStorage["mmb:v1"]).theme;document.documentElement.dataset.theme=t=="dark"||(t!="light"&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"}catch(e){}</script><title>Settings — MapMyBangladesh</title></head><body><header id="top"></header><main><section><h1>Settings</h1><div style="display:grid;gap:16px;max-width:560px">
<div class="card"><h2>Appearance</h2><select id="th" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="card"><h2>Backup</h2><button class="btn" id="ex">Export data (JSON)</button> <label class="btn" style="display:inline-block">Import<input type="file" id="im" accept="application/json" hidden></label></div>
<div class="card"><h2>Danger zone</h2><p class="mut">Removes every visited district, note and date from this device.</p><button class="btn dng" id="rs">Reset all</button></div></div></section></main><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const t=$('#th');t.value=state.theme;t.onchange=()=>{theme(t.value);save();toast('Theme updated')};
$('#rs').onclick=()=>{if(confirm('Reset all travel data? This cannot be undone.')){state.d={};save();toast('All data reset')}};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='mapmybangladesh.json';a.click()};
$('#im').onchange=e=>{const f=e.target.files[0];f&&f.text().then(x=>{try{const j=JSON.parse(x);if(!j.d)throw 0;state.d=j.d;save();toast('Data imported')}catch(_){toast('Invalid file')}})}})</script></body></html>
